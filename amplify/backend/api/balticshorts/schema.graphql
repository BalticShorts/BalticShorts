type UserProfile @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  name: String
  surname: String
  is_member: Boolean
  continues_payment: Boolean
  member_until: AWSDateTime
  monthsSubscribed: Int
  is_admin: Boolean
  email: AWSEmail
  user_id: String
  photo_location: String
  MoviePlaylists: [MoviePlaylist] @hasMany(indexName: "byUserProfile", fields: ["id"])
  Payments: [Payment] @hasMany(indexName: "byUserProfile", fields: ["id"])
  Emails: [Email] @hasMany(indexName: "byUserProfile", fields: ["id"])
}

type MovieType @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  type: String!
}

type PersonMovieTeam @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  movieteamID: ID! @index(name: "byMovieTeam")
  personID: ID! @index(name: "byPerson")
  MovieTeam: MovieTeam @belongsTo(fields: ["movieteamID"])
  Person: Person @belongsTo(fields: ["personID"])
  roleID: ID! @index(name: "byRole")
  Role: Role @belongsTo(fields: ["roleID"])
}

type Role @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  name: String!
  PersonMovieTeam: [PersonMovieTeam] @hasMany(indexName: "byRole", fields: ["id"])
  name_eng: String
  PersonRoles: [PersonRole] @hasMany(indexName: "byRole", fields: ["id"])
}

type Person @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  name: String!
  surname: String
  description: String
  Instagram: AWSURL
  Facebook: AWSURL
  IMBD: AWSURL
  email: AWSEmail
  PersonMovieTeams: [PersonMovieTeam] @hasMany(indexName: "byPerson", fields: ["id"])
  user_id: String
  is_public: Boolean
  completed_setup: Boolean
  description_confirmed: Boolean
  is_entity: Boolean
  nationality: String
  PersonRoles: [PersonRole] @hasMany(indexName: "byPerson", fields: ["id"])
}

type PersonRole @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  personID: ID! @index(name: "byPerson")
  roleID: ID! @index(name: "byRole")
  Person: Person @belongsTo(fields: ["personID"])
  Role: Role @belongsTo(fields: ["roleID"])
}

type MoviePlaylist @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  creator: String!
  movies: [Movie] @manyToMany(relationName: "MovieMoviePlaylist")
  title: String!
  description: String!
  is_public: Boolean!
  is_recommended: Boolean
  photo_location: String
  size: Int
  userprofileID: ID @index(name: "byUserProfile")
}

type MovieTeam @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  MovieName: String
  PersonMovieTeams: [PersonMovieTeam] @hasMany(indexName: "byMovieTeam", fields: ["id"])
  Movie: Movie @belongsTo
}

type Award @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  name: String!
  year: Int!
  category: String!
  comment: String
  movieID: ID! @index(name: "byMovie")
  movie: Movie @belongsTo(fields: ["movieID"])
}

type Movie @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  name: String
  name_eng: String
  genre: String
  description: String
  description_eng: String
  screen_language: String
  captions_language: String
  origin_country: String
  length: Int
  created_year: Int
  uploaded_at: String
  guid: ID
  MovieTeam: MovieTeam @hasOne
  MovieInPlaylists: [MoviePlaylist] @manyToMany(relationName: "MovieMoviePlaylist")
  times_watched: Int
  MovieType: MovieType @hasOne
  photo_location: String
  thumbnail_location: String
  age_rating: Int
  subtitles_location: String
  creators_comment: String
  is_highlighted: Boolean
  trailer_location: String
  awards: [Award] @hasMany(indexName: "byMovie", fields: ["id"])
}

type CountryCode @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  Country: String!
  Code: String!
}

type WaitlistEmail @model @auth(rules: [
  { allow: public, provider: iam, operations: [read, create] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  email: AWSEmail @index(name: "byEmail", queryField: "waitlistEmailByEmail")
}

type Payment @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  reference: String!
  email: AWSEmail!
  amount: Float!
  status: String!
  createdAt: AWSDateTime!
  klixId: String
  paymentType: String
  userprofileID: ID! @index(name: "byUserProfile", queryField: "paymentsByUserProfile")
  Email: Email @hasOne
}

type Email @model @auth(rules: [
  { allow: public, provider: iam, operations: [read] },
  { allow: private, provider: iam, operations: [read, create, update, delete] }
]) {
  id: ID!
  email: AWSEmail!
  message: String!
  createdAt: AWSDateTime!
  status: String!
  userprofileID: ID! @index(name: "byUserProfile", queryField: "emailsByUserProfile")
  paymentID: ID @index(name: "byPayment", queryField: "emailsByPayment")
}